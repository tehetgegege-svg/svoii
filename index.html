const av=(p,s,sm)=>`<div class="av ${sm?"sm":""}" style="background:${p.avatar?`url(${p.avatar}) center/cover`:`linear-gradient(135deg,hsl(${p.color},80%,60%),hsl(${p.color+50},80%,55%))`}">${p.avatar?"":E((p.name||"?")[0].toUpperCase())}${s?`<i class="dot" style="background:${ST[p.status||"free"][1]}"></i>`:""}</div>`;
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2600)};
const net=()=>{const n=$("#net");n.textContent=navigator.onLine?"онлайн":"нет сети";n.className=navigator.onLine?"":"off"};addEventListener("online",net);addEventListener("offline",net);
/* ====== лента ====== */
function stats(){const s={};S.invites.filter(i=>i.from=="me").forEach(i=>{const x=s[i.kind]=s[i.kind]||{n:0,ok:0};x.n++;if(Object.values(i.r).includes("ok"))x.ok++});return s}
function sendInvite(kind){const inv={id:Date.now(),kind,from:"me",ts:Date.now(),r:{}};S.invites.unshift(inv);if(kind!="smoke"){S.me.status=kind}save();draw();
 S.friends.forEach(f=>setTimeout(()=>{const a=Math.random()<.5?"ok":Math.random()<.5?"later":"busy";inv.r[f.id]=a;save();toast(f.name+": "+rnd(SAY[a]));if(tab=="home")draw()},1200+Math.random()*4500))}
function home(){const m=S.me,sp=stats(),inv=S.invites.filter(i=>i.from!="me"&&Date.now()-i.ts<108e5);
 return`<div class="card"><div class="row">${av(m,1)}<div class="f1"><b style="font-size:17px">${E(m.name)}</b><div class="m">${E(m.txt)||ST[m.status][0]}</div></div></div><div class="chips" style="margin-top:14px">${Object.entries(ST).map(([k,v])=>`<span class="chip ${m.status==k?"on":""}" data-a="st" data-k="${k}">${ic(v[2],16)}${v[0]}</span>`).join("")}</div></div>
 <div class="card"><h3>${ic("bolt",16)} Позвать на 15 минут</h3><div class="row">${Object.entries(KIND).map(([k,v])=>`<button class="g" data-a="inv" data-k="${k}">${ic(v[1],18)}${v[0]}</button>`).join("")}</div>
 ${S.invites.filter(i=>i.from=="me").slice(0,1).map(i=>`<div style="margin-top:14px"><div class="m">Твой последний зов: ${KIND[i.kind][0]}</div>${S.friends.map(f=>`<div class="row sp" style="margin-top:6px"><span class="row">${av(f,0,1)}${E(f.name)}</span><span class="m">${i.r[f.id]?ANS[i.r[f.id]][0]:"думает…"}</span></div>`).join("")}</div>`).join("")}</div>
 ${inv.map(i=>`<div class="card" style="border-color:var(--a)"><div class="row">${av(F(i.from))}<div class="f1"><b>${E(F(i.from).name)}</b><div class="m">${KIND[i.kind][0]} через 15 мин</div></div></div><div class="row" style="margin-top:12px">${Object.entries(ANS).map(([k,v])=>`<button class="s ${i.r.me==k?"":"g"}" data-a="rep" data-i="${i.id}" data-k="${k}">${ic(v[1],15)}${v[0]}</button>`).join("")}</div></div>`).join("")}
 <div class="card"><h3>${ic("users",16)} Друзья</h3>${S.friends.map(f=>`<div class="row" style="margin-bottom:14px">${av(f,1)}<div class="f1"><b>${E(f.name)}</b><div class="m">${E(f.txt)||ST[f.status][0]}</div>${f.show_pod?`<div class="bar" style="height:6px;margin:6px 0 0;max-width:140px"><i style="width:${f.pod_pct}%;background:var(--a)"></i></div><div class="m">под ${f.pod_pct}%${f.show_iq?` · стиков ${f.iq_sticks}`:""}</div>`:""}</div></div>`).join("")}
 ${NEWF?`<div class="row"><input id="fc" placeholder="Имя друга" class="f1"><button data-a="addf">${ic("check",18)}</button></div>`:`<button class="g s" data-a="nf">${ic("plus",16)}Добавить друга</button>`}</div>
 <div class="card"><h3>${ic("flame",16)} Наша статистика</h3>${Object.entries(KIND).map(([k,v])=>`<div class="row sp" style="margin-bottom:8px"><span class="row">${ic(v[1],18)}${v[0]}</span><span class="m">собрались ${sp[k]?.ok||0} из ${sp[k]?.n||0}</span></div>`).join("")}</div>`}
/* ====== арсенал и деньги ====== */
const tg=(k,t)=>`<button class="s ${S.me[k]?"on":"g"}" data-a="tg" data-k="${k}">${ic("users",15)}${t}: ${S.me[k]?"видят друзья":"скрыто"}</button>`;
const stp=(k)=>`<span class="row"><button class="g s" data-a="n" data-k="${k}" data-d="-1">${ic("minus",14)}</button><b style="min-width:26px;text-align:center">${S.me[k]}</b><button class="g s" data-a="n" data-k="${k}" data-d="1">${ic("plus",14)}</button></span>`;
function arsenal(){const m=S.me,bal=S.money.reduce((s,x)=>s+x.a,0);
 return`<div class="card"><h3>${ic("pod",16)} Под-система</h3><div class="row sp"><span>Заряд</span><b>${m.pod_pct}%</b></div><div class="bar"><i style="width:${m.pod_pct}%;background:linear-gradient(90deg,var(--b),var(--a))"></i></div><input type="range" data-r="pod_pct" value="${m.pod_pct}">
 <div class="row sp"><span>Жижа в картридже</span><b>${m.pod_juice}%</b></div><div class="bar"><i style="width:${m.pod_juice}%;background:var(--ok)"></i></div><input type="range" data-r="pod_juice" value="${m.pod_juice}">${tg("show_pod","Под")}</div>
 <div class="card"><h3>${ic("flame",16)} IQOS</h3><div class="row sp"><span>Стиков</span>${stp("iq_sticks")}</div><div class="m" style="margin-top:12px">Зарядка</div><div class="cells">${[1,2,3,4].map(i=>`<b class="${i<=m.iq_bars?"on":""}" data-bar="${i}"></b>`).join("")}</div><div style="margin-top:6px">${tg("show_iq","Айкос")}</div></div>
 <div class="card"><h3>${ic("smoke",16)} Сигареты</h3><div class="row sp"><span>В пачке</span>${stp("cig")}</div></div>
 <div class="card"><h3>${ic("coin",16)} Мои деньги</h3><div class="m row">${ic("lock",14)} Видишь только ты</div><div style="font-size:32px;font-weight:800;margin:6px 0 12px">${bal.toLocaleString("ru")}</div><div class="row"><input id="ma" type="number" inputmode="decimal" placeholder="Сумма" style="width:110px"><input id="mn" placeholder="На что" class="f1"></div><div class="row" style="margin-top:10px"><button class="s" data-a="mn" data-s="1">${ic("plus",15)}Доход</button><button class="g s" data-a="mn" data-s="-1">${ic("minus",15)}Расход</button></div>${S.money.slice(0,8).map(x=>`<div class="row sp m" style="margin-top:8px"><span>${E(x.n)}</span><b style="color:${x.a<0?"var(--r)":"var(--ok)"}">${x.a}</b></div>`).join("")}</div>`}
/* ====== карты ====== */
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cdh=(c,x="",n="")=>`<span class="cd ${/[♥♦]/.test(c)?"r":""} ${x}"><span>${c.slice(0,-1)}</span><span>${c.slice(-1)}&#xFE0E;</span>${n?`<em>${E(n)}</em>`:""}</span>`;
function dealCards(){const dk=[];for(const s of"♠♥♦♣")for(const r of["6","7","8","9","10","J","Q","K","A"])dk.push(r+s);sh(dk);
 const pl=[{id:"me",name:S.me.name},...S.friends.filter(f=>PICK.has(f.id)).map(f=>({id:f.id,name:f.name}))];pl.forEach(p=>p.hand=dk.splice(0,6));S.cg={pl,deck:dk,table:[],turn:0};save();botTurn()}
function throwCard(pi,ci){const g=S.cg,p=g.pl[pi],c=p.hand.splice(ci,1)[0];g.table.push({by:p.name,id:p.id,c});g.turn=(pi+1)%g.pl.length;save();draw();botTurn()}
function botTurn(){const g=S.cg;if(!g)return;const p=g.pl[g.turn];if(p.id=="me")return;setTimeout(()=>{if(S.cg!==g||g.pl[g.turn]!==p)return;if(!p.hand.length&&g.deck.length)p.hand.push(g.deck.shift());if(p.hand.length)throwCard(g.turn,Math.random()*p.hand.length|0);else{g.turn=(g.turn+1)%g.pl.length;save();draw();botTurn()}},1000+Math.random()*1200)}
function cardsView(){const g=S.cg,me=g.pl[0];
 return`<div class="row sp" style="margin-bottom:12px"><button class="g s" data-a="gx">${ic("back",16)}К играм</button><button class="g s" data-a="gn">Новая раздача</button></div>
 <div class="card"><div class="row" style="margin-bottom:12px">${g.pl.map((p,i)=>`<div class="row ${g.turn==i?"turn":""}" style="padding:6px 10px;border-radius:14px;background:var(--c2)">${av(F(p.id),0,1)}<div><div style="font-size:13px;font-weight:600">${E(p.name)}</div><div class="m">${p.id=="me"?"твои карты ниже":p.hand.length+" карт"}</div></div></div>`).join("")}</div>
 <h3>${ic("cards",16)} Общий стол</h3><div class="tbl">${g.table.map(t=>cdh(t.c,"",t.by)).join("")}</div>
 <div class="row" style="margin-top:12px"><button class="g" data-a="draw">Взять карту (${g.deck.length})</button><button class="g" data-a="clr">Убрать со стола</button></div></div>
 <div class="card ${g.turn==0?"turn":""}"><h3>${ic("lock",16)} Твои карты — ${g.turn==0?"твой ход":"ждём "+E(g.pl[g.turn].name)}</h3>${me.hand.map((c,i)=>`<span data-a="th" data-i="${i}">${cdh(c,"h")}</span>`).join("")||'<div class="m">Рука пуста — возьми карту из колоды</div>'}<div class="m" style="margin-top:6px">Нажми на карту, чтобы бросить её на стол</div></div>`}
/* ====== шашки (белые — ты, чёрные — бот) ====== */
const newCk=()=>{const b=Array(64).fill(0);for(let i=0;i<64;i++){const r=i>>3,c=i&7;if((r+c)%2){if(r<3)b[i]=2;if(r>4)b[i]=1}}return{b,t:1,cont:null,win:0}};
function moves(b,t,only){const o=[],caps=[];for(let i=0;i<64;i++){const v=b[i];if(!v||v%2!=t%2||(only!=null&&i!=only))continue;const k=v>2,r=i>>3,c=i&7,dir=t==1?-1:1;
 for(const dr of k?[-1,1]:[dir])for(const dc of[-1,1]){const r1=r+dr,c1=c+dc;if(r1<0||r1>7||c1<0||c1>7)continue;const j=r1*8+c1;
  if(!b[j])o.push({f:i,t:j,x:-1});else if(b[j]%2!=t%2){const r2=r1+dr,c2=c1+dc;if(r2>=0&&r2<8&&c2>=0&&c2<8&&!b[r2*8+c2])caps.push({f:i,t:r2*8+c2,x:j})}}}
 return caps.length?caps:(only!=null?[]:o)}
function applyM(m){const g=S.ck,b=g.b,v=b[m.f];b[m.t]=v;b[m.f]=0;if(m.x>=0)b[m.x]=0;if(v==1&&m.t<8)b[m.t]=3;if(v==2&&m.t>55)b[m.t]=4;
 if(m.x>=0&&b[m.t]==v&&moves(b,g.t,m.t).length){g.cont=m.t}else{g.cont=null;g.t=g.t==1?2:1;if(!moves(b,g.t).length)g.win=g.t==1?2:1}save()}
function ckBot(){const g=S.ck;if(!g||g.win||g.t!=2)return;setTimeout(()=>{if(S.ck!==g||g.t!=2)return;const ms=moves(g.b,2,g.cont);if(!ms.length)return;const m=ms.find(x=>x.x>=0&&x.t>55)||rnd(ms.filter(x=>x.x>=0).length?ms.filter(x=>x.x>=0):ms);applyM(m);draw();ckBot()},700)}
function ckCell(i){const g=S.ck;if(g.t!=1||g.win)return;const v=g.b[i];
 if(v&&v%2==1&&g.cont==null){SEL=i;return draw()}
 const m=SEL!=null&&moves(g.b,1,g.cont).find(x=>x.f==(g.cont??SEL)&&x.t==i);if(!m)return;SEL=null;applyM(m);if(g.cont!=null)SEL=g.cont;draw();ckBot()}
function ckView(){const g=S.ck,tg=SEL!=null?moves(g.b,1,g.cont).filter(m=>m.f==(g.cont??SEL)).map(m=>m.t):[];
 return`<div class="row sp" style="margin-bottom:12px"><button class="g s" data-a="gx">${ic("back",16)}К играм</button><button class="g s" data-a="ckn">Заново</button></div><div class="card"><div class="m" style="margin-bottom:10px">${g.win?`<b>Победили ${g.win==1?"ты":"чёрные (бот)"}</b>`:g.t==1?"Твой ход (белые)"+(g.cont!=null?" — бей дальше":""):"Думает бот…"}</div><div class="chk">${g.b.map((v,i)=>`<div data-s="${i}" class="${((i>>3)+(i&7))%2?"d":"l"} ${SEL===i?"sel":""} ${tg.includes(i)?"tg":""}">${v?`<i class="pc ${v%2?"w":"k"} ${v>2?"q":""}">${v>2?"К":""}</i>`:""}</div>`).join("")}</div><div class="m" style="margin-top:10px">Бить обязательно. Дамки ходят в любую сторону.</div></div>`}
let GM=null;
function rest(){if(GM=="cards"&&S.cg)return cardsView();if(GM=="ck"&&S.ck)return ckView();
 return`<div class="card"><h3>${ic("cards",16)} Карты</h3><div class="m" style="margin-bottom:10px">С кем играем (у каждого свои 6 карт):</div><div class="chips">${S.friends.map(f=>`<span class="chip ${PICK.has(f.id)?"on":""}" data-a="pk" data-k="${f.id}">${E(f.name)}</span>`).join("")}</div><div class="row" style="margin-top:12px"><button data-a="gc">${ic("cards",18)}Раздать</button>${S.cg?`<button class="g" data-a="gcc">Продолжить</button>`:""}</div></div>
 <div class="card"><h3>${ic("game",16)} Шашки против бота</h3><div class="row"><button data-a="gk">${ic("game",18)}Новая партия</button>${S.ck?`<button class="g" data-a="gkc">Продолжить</button>`:""}</div></div>`}
/* ====== чаты ====== */
function chat(){const f=S.fams.find(x=>x.id==room);
 return`<div class="card"><div class="chips"><span class="chip ${room=="all"?"on":""}" data-a="sf" data-k="all">${ic("chat",16)}Общий</span>${S.fams.map(x=>`<span class="chip ${room==x.id?"on":""}" data-a="sf" data-k="${x.id}">${ic("users",16)}${E(x.name)}</span>`).join("")}<span class="chip" data-a="nfam">${ic("plus",16)}Семья</span></div>
 ${f?`<div class="row" style="margin-top:12px">${f.members.map(i=>av(F(i),1,1)).join("")}<div class="f1"><div class="m">Статус семьи</div></div></div><div class="row" style="margin-top:8px"><input id="fs" placeholder="Вместе, на даче…" value="${E(f.status)}" class="f1"><button class="s" data-a="fst">${ic("check",16)}</button></div>`:""}
 ${NEWFAM.size||NEWF=="fam"?`<div style="margin-top:12px"><input id="fn" placeholder="Название семьи"><div class="chips" style="margin:10px 0">${S.friends.map(x=>`<span class="chip ${NEWFAM.has(x.id)?"on":""}" data-a="fm" data-k="${x.id}">${E(x.name)}</span>`).join("")}</div><button class="s" data-a="mkf">Создать семью</button></div>`:""}</div>
 <div class="card"><div id="ml" style="min-height:160px"></div><div class="row" style="margin-top:12px"><input id="mt" placeholder="Сообщение" class="f1"><button data-a="send">${ic("send",18)}</button></div></div>`}
function updMsgs(){const el=$("#ml");if(!el)return;const ms=S.msgs[room]||[];el.innerHTML=ms.slice(-50).map(m=>`<div class="msg ${m.f=="me"?"me":""}"><small>${E(m.f=="me"?S.me.name:F(m.f).name)}</small>${E(m.body)}</div>`).join("")||'<div class="m">Пока тихо…</div>';$("#v").scrollTop=1e9}
function botSay(r){const f=S.fams.find(x=>x.id==r),pool=f?f.members:S.friends.map(x=>x.id);setTimeout(()=>{(S.msgs[r]=S.msgs[r]||[]).push({f:rnd(pool),body:rnd(TALK),ts:Date.now()});save();if(tab=="fam"&&room==r)updMsgs();else toast("Новое сообщение")},1800+Math.random()*2500)}
function prof(){return cab()}
function welcome(){return`<div class="card" style="margin-top:30px"><h3>${ic("user",16)} Добро пожаловать</h3><input id="wn" placeholder="Как тебя зовут?"><div class="chips" style="margin:14px 0">${[260,330,200,30,150,90].map(h=>`<span class="av sm" data-a="wc" data-k="${h}" style="cursor:pointer;background:hsl(${h},80%,60%);outline:${S.me.color==h?"3px solid var(--t)":"0"}"></span>`).join("")}</div><button data-a="wg" style="width:100%">Поехали</button></div>`}
/* ====== рендер ====== */
function nav(){const T=[["home","home","Лента"],["arsenal","bolt","Арсенал"],["rest","game","Игры"],["fam","chat","Чаты"],["me","user","Я"]];$("#nv").innerHTML=S.me.name?T.map(t=>`<button data-t="${t[0]}" class="${tab==t[0]?"on":""}">${ic(t[1],22)}${t[2]}</button>`).join(""):""}
function draw(){const a=document.activeElement,id=a&&a.tagName=="INPUT"?a.id:null,val=id?a.value:"",pos=id?a.selectionStart:0,sc=$("#v").scrollTop;nav();
 $("#v").innerHTML=!S.me.name?welcome():({home,arsenal,rest,fam:chat,me:prof}[tab])();if(tab=="fam"&&S.me.name)updMsgs();$("#v").scrollTop=tab=="fam"?1e9:sc;
 if(id&&$("#"+id)){const n=$("#"+id);if(n.type!="range"){n.value=val;n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}}
const V=id=>$("#"+id)?.value.trim();
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-t]");if(t){tab=t.dataset.t;draw();return}
 const bar=e.target.closest("[data-bar]");if(bar){S.me.iq_bars=+bar.dataset.bar;save();draw();return}
 const s=e.target.closest("[data-s]");if(s&&GM=="ck"){ckCell(+s.dataset.s);return}
 const a=e.target.closest("[data-a]");if(!a)return;const d=a.dataset,m=S.me;
 switch(d.a){
 case"wc":m.color=+d.k;draw();$("#wn")&&0;return;
 case"wg":{const n=V("wn");if(n.length<1)return;m.name=n;save();draw();setTimeout(()=>{const f=rnd(S.friends);S.invites.unshift({id:Date.now(),kind:"coffee",from:f.id,ts:Date.now(),r:{}});save();toast(f.name+" зовёт на кофе");if(tab=="home")draw()},12000);return}
 case"st":m.status=d.k;m.txt=d.k=="coffee"?"Давайте через 15 минут на кофе":"";break;
 case"sp":m.txt=V("pt");tab="home";break;
 case"tg":m[d.k]=m[d.k]?0:1;break;
 case"n":m[d.k]=Math.max(0,m[d.k]+ +d.d);break;
 case"inv":sendInvite(d.k);return;
 case"rep":{const i=S.invites.find(x=>x.id==+d.i);i.r.me=d.k;toast(d.k=="ok"?"Договорились":"Ответ отправлен");break}
 case"nf":NEWF=true;break;
 case"addf":{const n=V("fc");if(n){S.friends.push(mkF("f"+Date.now(),n,Math.random()*360|0,"free","",60+Math.random()*40|0,5));NEWF=false}break}
 case"mn":{const n=+V("ma");if(n)S.money.unshift({a:n*d.s,n:V("mn")||(d.s>0?"Доход":"Расход")});break}
 case"sf":room=d.k;break;
 case"nfam":NEWF="fam";NEWFAM=new Set(NEWFAM);break;
 case"fm":NEWFAM.has(d.k)?NEWFAM.delete(d.k):NEWFAM.add(d.k);break;
 case"mkf":{const n=V("fn");if(n&&NEWFAM.size){const f={id:"fam"+Date.now(),name:n,members:[...NEWFAM],status:""};S.fams.push(f);room=f.id;NEWFAM.clear();NEWF=false}break}
 case"fst":S.fams.find(x=>x.id==room).status=V("fs");toast("Статус семьи обновлён");break;
 case"send":{const x=V("mt");if(!x)return;$("#mt").value="";(S.msgs[room]=S.msgs[room]||[]).push({f:"me",body:x,ts:Date.now()});save();updMsgs();if(Math.random()<.8)botSay(room);return}
 case"pk":PICK.has(d.k)?PICK.delete(d.k):PICK.add(d.k);break;
 case"gc":if(!PICK.size){toast("Выбери хотя бы одного друга");return}dealCards();GM="cards";break;
 case"gcc":GM="cards";botTurn();break;
 case"gn":dealCards();break;
 case"gx":GM=null;SEL=null;break;
 case"th":{const g=S.cg;if(g.turn!=0){toast("Сейчас ходит "+g.pl[g.turn].name);return}throwCard(0,+d.i);return}
 case"draw":{const g=S.cg;if(g.deck.length){g.pl[0].hand.push(g.deck.shift());save()}break}
 case"clr":S.cg.table=[];save();break;
 case"gk":S.ck=newCk();GM="ck";SEL=null;break;
 case"gkc":GM="ck";ckBot();break;
 case"ckn":S.ck=newCk();SEL=null;break}
